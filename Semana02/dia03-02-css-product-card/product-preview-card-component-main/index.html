<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <main class="producto">

    <div class="imagen">
        <img src="images/image-product-desktop.jpg" alt="">
    </div>

    <div class="contenido">
        <p class="categoria">PERFUME</p>

        <h1>Gabrielle Essence Eau De Parfum</h1>

        <p>
            A floral, solar and voluptuous
            interpretation composed by
            Olivier Polge, Perfumer-Creator
            for the House of CHANEL.
        </p>

        <div class="precios">
            <span>$149.99</span>
            <del>$169.99</del>
        </div>

        <button type="button">
            <img src="images/icon-cart.svg" alt="">
            Add to Cart
        </button>
    </div>

</main>
  
</body>
</html>
